services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-emailsentinel}
      POSTGRES_USER: ${POSTGRES_USER:-emailsentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-emailsentinel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-emailsentinel}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-emailsentinel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-emailsentinel}
      REDIS_ENABLED: "true"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ASYNC_ANALYSIS_ENABLED: "true"
      ENABLE_GEOLOCATION: ${ENABLE_GEOLOCATION:-true}
      ENABLE_DNS: ${ENABLE_DNS:-true}
      ENABLE_WHOIS: ${ENABLE_WHOIS:-false}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-emailsentinel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-emailsentinel}
      REDIS_ENABLED: "true"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ENABLE_GEOLOCATION: ${ENABLE_GEOLOCATION:-true}
      ENABLE_DNS: ${ENABLE_DNS:-true}
      ENABLE_WHOIS: ${ENABLE_WHOIS:-false}
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "worker", "--loglevel=INFO"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
